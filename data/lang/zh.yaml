nsw_patterns:
  纯数字: \d+
  时间/版本(数字分隔): \d+[:.]\d+
  币种/符号(CNY): ¥|￥|元|人民币
  号码(+86等): \+?\d[\d\s-]{7,}
  全大写缩写: \b[A-Z]{2,}\b
  网址/邮件: https?://\S+|[\w.+-]+@[\w-]+\.\w+
sentence_targets:
  陈述:
  - 0.7
  - 0.8
  短语:
  - 0.05
  - 0.15
  疑问:
  - 0.1
  - 0.2
  感叹:
  - 0.1
  - 0.2
ipa_dict: ipa/zh.txt
g2p:
  fallback: none
  patch: {}
syllable:
  method: na
etymology:
  prompt_name: 中文(zh)
